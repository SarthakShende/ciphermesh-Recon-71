[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ciphermesh-edge"
version = "1.0.0"
description = "CipherMesh Edge - hardware-rooted decentralized IoT trust network agent for Raspberry Pi 4B"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CipherMesh" }]
keywords = ["iot", "lorawan", "lora", "reticulum", "ed25519", "raspberry-pi", "trust"]

dependencies = [
    "cryptography>=42.0,<47.0",
    "PyYAML>=6.0,<7.0",
    "pyserial>=3.5",
    "rns>=1.5,<1.6",
    "psutil>=5.9",
]

[project.optional-dependencies]
cloud = ["httpx>=0.27,<1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27,<1.0",
]

[project.scripts]
ciphermesh = "ciphermesh.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ciphermesh = ["storage/migrations/*.sql"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "rns: requires the Reticulum Network Stack to be importable",
    "hardware: requires real hardware (radio, sensor, gpio)",
    "slow: long-running test",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",
    "SIM105",
    "RUF001", # ambiguous unicode in strings - we use it in logs
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["ciphermesh"]
